worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/svg+xml;
  # Auth callbacks and media grants can carry secrets in URLs; access logs omit URI/query/body.
  log_format safe '$request_method $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map "$request_method:$uri" $deferred_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):/v1/tenants/[^/]+/projects/[^/]+/(cuts|cut-revisions|external-cuts|cut-normalizations)(/|$) 1;
  }
  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($deferred_write) { return 503 '{"code":"POST_PRODUCTION_DEFERRED"}'; }
    location /v1/ {
      proxy_pass http://api:4310;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 90s;
    }
    location /health/ {
      proxy_pass http://api:4310;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
    }
    location /design/ { return 404; }
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control no-store;
      try_files $uri $uri/ /index.html;
    }
  }
}
