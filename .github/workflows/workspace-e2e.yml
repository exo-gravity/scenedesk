name: SceneDesk creative workspace E2E
# Path-filtered: the browser suite needs a production build, Chromium and a live API, so it must
# not run for documentation-only or evidence-only changes. The universal cheap gate stays
# unfiltered in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-e2e.yml'
      - 'apps/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.nvmrc'
  pull_request:
    paths:
      - '.github/workflows/workspace-e2e.yml'
      - 'apps/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - '.nvmrc'
permissions:
  contents: read
jobs:
  verify-workspace-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: workspace_e2e
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: drama_e2e_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workspace_e2e -d drama_e2e_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://workspace_e2e:synthetic_ci_only@127.0.0.1:5432/drama_e2e_ci
      PROVIDER_MODE: mock
      SCENEDESK_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Install Chromium pinned by the npm lockfile
        run: npx playwright install --with-deps chromium
      - name: Exercise production Web and real restricted-role API
        run: npm run test:e2e
      - name: Retain synthetic screenshots and assertion context only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: creative-workspace-e2e
          path: |
            output/playwright/**/results/**/*.png
            output/playwright/**/results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
